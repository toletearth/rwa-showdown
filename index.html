<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RWA SHOWDOWN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.cdnfonts.com/css/anton');
@import url('https://fonts.cdnfonts.com/css/inter');

:root{
  --bg: #0b0c0f;
  --bg2: #141519;
  --steel: #3a3d44;
  --steel-line: #2a2c31;
  --blood: #c22a1e;
  --gold: #d4a72c;
  --ice: #5fd0e8;
  --off: #e9e6df;
  --dim: #9a9a9f;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background: radial-gradient(ellipse at 50% -10%, #1c1e24 0%, var(--bg) 55%);
  color: var(--off);
  font-family: 'Inter', system-ui, sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
.crowd-glow{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(194,42,30,0.08), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(95,208,232,0.06), transparent 40%);
}
.wrap{ position:relative; z-index:1; max-width:600px; margin:0 auto; padding: 12px 14px 40px; }

/* TOP APP BAR */
.topbar-app{ display:flex; align-items:center; justify-content:space-between; padding:8px 2px 14px; }
body.hide-topbar .topbar-app{ display:none; }
.tb-left{ display:flex; align-items:center; gap:10px; cursor:pointer; }
.tb-avatar{ width:38px;height:38px;border-radius:50%; background:var(--bg2); border:2px solid var(--gold); display:flex;align-items:center;justify-content:center; font-family:'Anton',sans-serif; color:var(--gold); font-size:16px; flex-shrink:0; }
.tb-name{ font-size:13px; font-weight:700; color:var(--off); line-height:1.2; }
.tb-rank{ font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
.tb-right{ display:flex; align-items:center; gap:8px; }
.tb-stat{ display:flex; align-items:center; gap:4px; font-size:12px; font-weight:700; background:var(--bg2); border:1px solid var(--steel-line); padding:5px 9px; border-radius:20px; }
.tb-gear{ background:none;border:none;font-size:17px;cursor:pointer; color:var(--dim); padding:4px; }

/* SCREENS */
.screen{ display:none; }
.screen.active{ display:block; animation: fadeIn .3s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

.subheader{ display:flex; align-items:center; gap:12px; padding:4px 0 18px; }
.back-btn{ width:34px;height:34px;border-radius:50%; background:var(--bg2); border:1px solid var(--steel-line); color:var(--off); font-size:16px; cursor:pointer; flex-shrink:0; }
.subheader-title{ font-family:'Anton', sans-serif; font-size:18px; letter-spacing:1px; }

.footer-note{ text-align:center; color:var(--steel); font-size:11px; margin-top:28px; letter-spacing:1px; }

.btn{
  display:block; text-align:center;
  font-family:'Anton', sans-serif; letter-spacing: 1px; font-size:16px;
  padding: 14px 28px; background: var(--blood); color: #fff; border:none; border-radius: 4px;
  cursor:pointer; width:100%; transition: filter .12s, transform .08s;
}
.btn:hover{ filter:brightness(1.12); }
.btn:active{ transform: scale(0.98); }
.btn.ghost{ background:var(--bg2); border:1px solid var(--steel-line); color:var(--off); }
.btn + .btn{ margin-top:10px; }

/* MAIN MENU */
.menu-hero{ position:relative; margin:0 -14px; height:210px; overflow:hidden; }
.menu-hero img{ width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
.menu-hero-fade{ position:absolute; inset:0; background:linear-gradient(to bottom, rgba(11,12,15,0.1) 35%, var(--bg) 96%); }
.menu3d-wrap{ position:absolute; left:0; top:0; width:46%; height:100%; z-index:3; touch-action:none; }
.menu3d-wrap canvas{ width:100% !important; height:100% !important; display:block; }
.menu3d-caption{ position:absolute; bottom:10px; left:0; width:46%; text-align:center; z-index:4; font-size:9.5px; letter-spacing:1.5px; color:var(--gold); text-shadow:0 1px 4px rgba(0,0,0,0.8); opacity:0.85; }
.menu-brand{ text-align:center; margin-top:-46px; position:relative; z-index:2; }
.brand-big{ font-family:'Anton',sans-serif; font-size:58px; color:var(--gold); text-shadow:0 0 24px rgba(212,167,44,0.45); letter-spacing:2px; line-height:1; }
.brand-sub{ font-size:12px; letter-spacing:4px; color:var(--off); margin-top:2px; }
.brand-tagline{ font-size:11px; letter-spacing:3px; color:var(--dim); margin-top:10px; }
.menu-buttons{ margin-top:28px; }

/* MODE SELECT */
.mode-list{ display:flex; flex-direction:column; gap:12px; }
.mode-row{ display:flex; align-items:center; gap:14px; background:var(--bg2); border:1px solid var(--steel-line); border-radius:8px; padding:16px; cursor:pointer; transition:border-color .15s, transform .1s; }
.mode-row:hover{ border-color:var(--gold); transform:translateY(-1px); }
.mode-row.locked{ opacity:0.4; cursor:default; }
.mode-row.locked:hover{ border-color:var(--steel-line); transform:none; }
.mode-row-icon{ font-size:26px; width:34px; text-align:center; flex-shrink:0; }
.mode-row-text{ flex:1; }
.mode-row-title{ font-family:'Anton',sans-serif; font-size:16px; letter-spacing:0.5px; }
.mode-row-sub{ font-size:12px; color:var(--dim); margin-top:1px; }
.mode-row-arrow{ font-size:20px; color:var(--dim); flex-shrink:0; }

/* COLLECTION */
.collection-tabs{ display:flex; gap:8px; margin-bottom:12px; }
.tab{ flex:1; background:var(--bg2); border:1px solid var(--steel-line); color:var(--dim); padding:9px 4px; border-radius:20px; font-size:11px; letter-spacing:0.5px; cursor:pointer; font-weight:700; }
.tab.active{ background:var(--blood); border-color:var(--blood); color:#fff; }
.search-box{ width:100%; background:var(--bg2); border:1px solid var(--steel-line); border-radius:8px; padding:11px 14px; color:var(--off); font-size:13px; margin-bottom:14px; }
.search-box::placeholder{ color:var(--dim); }
.collection-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding-bottom:20px; }
.collection-card{ background:var(--bg2); border:1px solid var(--steel-line); border-radius:8px; overflow:hidden; cursor:pointer; position:relative; }
.collection-card img{ width:100%; aspect-ratio:2/3; object-fit:cover; object-position:top; display:block; }
.cc-rank{ position:absolute; top:5px; left:5px; background:rgba(0,0,0,0.75); color:var(--gold); font-family:'Anton',sans-serif; font-size:10px; padding:2px 6px; border-radius:4px; }
.cc-name{ padding:5px 4px; font-size:9.5px; font-weight:700; text-align:center; letter-spacing:0.2px; line-height:1.2; }
.collection-empty{ text-align:center; color:var(--dim); font-size:13px; padding:30px 0; }

.card-modal{ position:fixed; inset:0; background:rgba(0,0,0,0.88); display:none; align-items:center; justify-content:center; z-index:50; padding:24px; }
.card-modal.show{ display:flex; }
.card-modal-inner{ max-width:340px; width:100%; position:relative; }
.card-modal-inner img{ width:100%; border-radius:10px; display:block; }
.card-modal-close{ position:absolute; top:-14px; right:-14px; width:32px;height:32px; border-radius:50%; background:var(--blood); color:#fff; border:2px solid var(--bg); font-size:14px; cursor:pointer; z-index:5; }
.view3d-btn{ margin-top:12px; }
.viewer3d-inner{ max-width:360px; width:100%; position:relative; background:var(--bg2); border:1px solid var(--steel-line); border-radius:10px; padding:16px; }
.viewer3d-canvas-wrap{ width:100%; }
#viewer3d-canvas-wrap{ width:100%; aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:radial-gradient(circle at 50% 30%, #1a2a20, #0b0c0f); touch-action:none; }
#viewer3d-canvas-wrap canvas{ width:100% !important; height:100% !important; display:block; }
.viewer3d-status{ text-align:center; color:var(--dim); font-size:12px; margin-top:10px; }
.viewer3d-hint{ text-align:center; color:var(--steel); font-size:10.5px; margin-top:4px; letter-spacing:0.5px; }

/* PROFILE */
.profile-card{ text-align:center; background:var(--bg2); border:1px solid var(--steel-line); border-radius:10px; padding:24px 16px; margin-bottom:16px; }
.profile-avatar{ width:72px;height:72px; border-radius:50%; background:var(--bg); border:3px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:28px; color:var(--gold); margin:0 auto 10px; }
.profile-name{ font-family:'Anton',sans-serif; font-size:20px; }
.profile-edit{ background:none;border:none; color:var(--dim); font-size:11px; text-decoration:underline; cursor:pointer; margin-top:4px; padding:4px; }
.profile-rank{ display:inline-block; margin-top:10px; background:var(--blood); color:#fff; font-size:10px; padding:4px 12px; border-radius:20px; letter-spacing:1px; font-weight:700; }
.xp-bar{ width:100%; height:8px; background:var(--bg); border-radius:6px; overflow:hidden; margin-top:16px; }
.xp-fill{ height:100%; background:linear-gradient(90deg,var(--gold),#f0d878); width:0%; transition:width .4s; }
.xp-label{ font-size:11px; color:var(--dim); margin-top:6px; }
.profile-stats-row{ display:flex; gap:10px; margin-bottom:16px; }
.pstat{ flex:1; background:var(--bg2); border:1px solid var(--steel-line); border-radius:8px; text-align:center; padding:14px 6px; }
.pstat-num{ font-family:'Anton',sans-serif; font-size:22px; color:var(--gold); }
.pstat-label{ font-size:9.5px; color:var(--dim); letter-spacing:0.3px; margin-top:2px; }
.profile-list{ display:flex; flex-direction:column; gap:8px; }
.profile-list-item{ display:flex; justify-content:space-between; align-items:center; background:var(--bg2); border:1px solid var(--steel-line); border-radius:8px; padding:15px 16px; font-size:13px; cursor:pointer; }
.profile-list-item span:last-child{ color:var(--dim); font-size:12px; }

/* ACHIEVEMENTS */
.ach-item{ display:flex; align-items:center; gap:14px; background:var(--bg2); border:1px solid var(--steel-line); border-radius:8px; padding:14px; margin-bottom:10px; }
.ach-item.locked{ opacity:0.4; }
.ach-icon{ font-size:26px; width:32px; text-align:center; flex-shrink:0; }
.ach-title{ font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.3px; }
.ach-desc{ font-size:11.5px; color:var(--dim); margin-top:1px; }

/* SHOP */
.shop-list{ display:flex; flex-direction:column; gap:10px; }
.shop-item{ display:flex; align-items:center; gap:12px; background:var(--bg2); border:1px solid var(--steel-line); border-radius:8px; padding:12px 14px; }
.shop-item-swatch{ width:44px; height:44px; border-radius:50%; flex-shrink:0; background:var(--bg); }
.shop-item-text{ flex:1; }
.shop-item-title{ font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.3px; }
.shop-item-cost{ font-size:11.5px; color:var(--dim); margin-top:1px; }
.shop-item-btn{ font-family:'Anton',sans-serif; letter-spacing:0.5px; font-size:11px; padding:8px 14px; border-radius:5px; border:none; cursor:pointer; flex-shrink:0; }
.shop-item-btn.buy{ background:var(--blood); color:#fff; }
.shop-item-btn.equip{ background:var(--bg); color:var(--off); border:1px solid var(--steel-line); }
.shop-item-btn.equipped{ background:#6fe38a; color:#0b0c0f; cursor:default; }

.foil-card{ position:relative; }
.foil-card .cc-unlock-btn{
  position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.82); color:var(--gold);
  font-size:9.5px; font-weight:700; letter-spacing:0.3px; text-align:center; padding:5px 2px; border:none; cursor:pointer;
}
.foil-owned-badge{ position:absolute; top:5px; right:5px; background:rgba(0,0,0,0.7); border-radius:4px; padding:2px 5px; font-size:12px; }
.foil-overlay{
  position:absolute; inset:0; pointer-events:none;
  background: linear-gradient(115deg, transparent 15%, rgba(255,0,170,0.45) 30%, rgba(0,255,220,0.45) 45%, rgba(255,225,0,0.45) 60%, transparent 80%);
  background-size:250% 250%;
  mix-blend-mode: color-dodge;
  animation: foilShift 3.5s linear infinite;
}
@keyframes foilShift{ 0%{ background-position:0% 0%; } 100%{ background-position:250% 250%; } }
.card-modal-inner .foil-overlay{ border-radius:10px; }

.frame-classic{ border-color: var(--gold) !important; }
.frame-silver{ border-color: #c9d1d9 !important; }
.frame-ice{ border-color: var(--ice) !important; }
.frame-blood{ border-color: var(--blood) !important; }
.frame-emerald{ border-color: #3fae6a !important; }
.frame-royal{
  border-color: var(--gold) !important;
  animation: royalHue 3s linear infinite;
}
@keyframes royalHue{ 0%{ filter:hue-rotate(0deg);} 100%{ filter:hue-rotate(360deg);} }

.rules-strip{
  background: var(--bg2); border: 1px solid var(--steel-line); border-radius: 6px;
  padding: 16px 16px; font-size:13px; color: var(--dim); line-height:1.7;
}
.rules-strip b{ color:var(--off); }
.rules-strip + .rules-strip{ margin-top:12px; }

/* ARENA */
.arena-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.arena-side{ display:flex; align-items:center; gap:8px; }
.arena-side.right{ flex-direction:row-reverse; }
.arena-avatar{ width:34px;height:34px;border-radius:50%; background:var(--bg2); border:2px solid var(--steel-line); display:flex;align-items:center;justify-content:center; font-size:15px; flex-shrink:0; }
.arena-avatar.you{ border-color:var(--ice); }
.arena-avatar.rival{ border-color:var(--blood); }
.arena-side-text{ font-size:11px; line-height:1.3; }
.arena-side-text .n{ font-weight:700; }
.arena-side-text .c{ color:var(--dim); }
.arena-side-text.right{ text-align:right; }
.arena-crest{ font-family:'Anton',sans-serif; color:var(--gold); font-size:15px; letter-spacing:1px; }

.scoreboard{ display:flex; justify-content:center; margin-bottom: 14px; }
.scoreboard .pill{ background:var(--bg2); border:1px solid var(--gold); color:var(--gold); border-radius:20px; padding:5px 16px; font-size:11px; font-weight:700; letter-spacing:0.5px; }

.arena{ display:grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items:start; }
.vs-medal{ font-family:'Anton', sans-serif; font-size:18px; color:var(--dim); align-self:center; padding-top: 90px; }
.slot{ text-align:center; }
.slot-label{ font-size:10.5px; letter-spacing:2px; color:var(--dim); margin-bottom:8px; text-transform:uppercase; }

.card3d{
  width:100%; max-width: 230px; margin:0 auto; aspect-ratio: 2/3; border-radius: 8px;
  overflow:hidden; position:relative; background: var(--bg2); border: 1px solid var(--steel-line);
}
.card-face{ position:absolute; inset:0; display:flex; flex-direction:column; opacity:0; z-index:1; transition: opacity .35s ease, transform .35s ease; transform: scaleX(1); }
.card-back{ background: repeating-linear-gradient(45deg, #1a1c21, #1a1c21 10px, #202226 10px, #202226 20px); align-items:center; justify-content:center; opacity:1; z-index:2; }
.card3d.flipped .card-back{ opacity:0; z-index:1; transform: scaleX(0.85); }
.card3d.flipped .card-front{ opacity:1; z-index:2; transform: scaleX(1); }
.card-front img{ width:100%; height:100%; object-fit:contain; display:block; }

.stat-highlight{
  position:absolute; left:65.5%; width:32%; border-radius:5px; border:2px solid transparent;
  background:rgba(0,0,0,0); opacity:0; transition: opacity .3s ease, border-color .3s ease, background .3s ease;
  pointer-events:none;
}
.stat-highlight.show{ opacity:1; }
.stat-highlight.win{ border-color:#6fe38a; background:rgba(111,227,138,0.28); box-shadow:0 0 14px rgba(111,227,138,0.65); }
.stat-highlight.lose{ border-color:#d95d55; background:rgba(217,93,85,0.28); box-shadow:0 0 14px rgba(217,93,85,0.65); }
.stat-highlight.tie{ border-color:#d4a72c; background:rgba(212,167,44,0.28); box-shadow:0 0 14px rgba(212,167,44,0.65); }

.cat-picker{ margin-top: 22px; }
.cat-picker-label{ text-align:center; font-size:12px; letter-spacing:1.5px; color:var(--dim); margin-bottom:10px; text-transform:uppercase; }
.cat-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
.cat-btn{
  background: var(--bg2); border:1px solid var(--steel-line); color:var(--off); border-radius:4px; padding:10px 6px;
  font-size:12px; cursor:pointer; display:flex; flex-direction:column; gap:2px; align-items:center;
  transition: border-color .12s, background .12s;
}
.cat-btn .ico{ font-size:16px; }
.cat-btn .lbl{ color:var(--dim); font-size:10px; letter-spacing:0.5px; text-transform:uppercase; }
.cat-btn .val{ font-weight:700; font-size:14px; }
.cat-btn:hover:not(:disabled){ border-color: var(--gold); }
.cat-btn:disabled{ opacity:0.4; cursor:default; }

.log{ margin-top:20px; background:var(--bg2); border:1px solid var(--steel-line); border-radius:4px; padding: 12px 14px; font-size:12.5px; color:var(--dim); max-height:110px; overflow-y:auto; }
.log div{ padding:2px 0; }
.log .win{ color:#6fe38a; }
.log .lose{ color:#d95d55; }
.log .tie{ color: var(--gold); }

.result-banner{ text-align:center; margin-top:16px; min-height:26px; font-family:'Anton', sans-serif; letter-spacing:1px; font-size:18px; }
.result-banner.win{ color:#6fe38a; }
.result-banner.lose{ color:#d95d55; }
.result-banner.tie{ color: var(--gold); }

/* RESULT SCREEN */
.result-hero{ text-align:center; padding-top:24px; }
.result-crest{ font-family:'Anton',sans-serif; color:var(--gold); font-size:15px; letter-spacing:4px; }
.result-title{ font-family:'Anton',sans-serif; font-size:42px; color:#6fe38a; text-shadow:0 0 22px rgba(111,227,138,0.5); margin:8px 0 18px; }
.result-title.lose{ color:#d95d55; text-shadow:0 0 22px rgba(217,93,85,0.5); }
.result-cardwrap{ max-width:190px; margin:0 auto 18px; border-radius:10px; overflow:hidden; border:2px solid var(--gold); box-shadow:0 0 30px rgba(212,167,44,0.3); }
.result-cardwrap img{ width:100%; display:block; }
.result-sub{ font-family:'Anton',sans-serif; font-size:22px; }
.result-detail{ color:var(--dim); font-size:13px; margin-top:6px; }
.result-rewards{ color:var(--gold); font-size:13px; margin-top:12px; font-weight:700; letter-spacing:0.5px; }
.result-buttons{ max-width:280px; margin:24px auto 0; }
</style>
</head>
<body>
<div class="crowd-glow"></div>
<div class="wrap">

  <div class="topbar-app" id="topbar-app">
    <div class="tb-left" onclick="showScreen('profile')">
      <div class="tb-avatar" id="tb-avatar">P</div>
      <div>
        <div class="tb-name" id="tb-name">Player1</div>
        <div class="tb-rank" id="tb-rank">Rookie</div>
      </div>
    </div>
    <div class="tb-right">
      <div class="tb-stat">🪙 <span id="tb-coins">1250</span></div>
      <div class="tb-stat">💎 <span id="tb-gems">50</span></div>
      <button class="tb-gear" onclick="showScreen('settings')">⚙</button>
    </div>
  </div>

  <!-- MAIN MENU -->
  <div class="screen active" id="screen-menu">
    <div class="menu-hero">
      <img src="sharp-edge.jpg" alt="">
      <div class="menu-hero-fade"></div>
      <div class="menu3d-wrap" id="menu3d-wrap"></div>
      <div class="menu3d-caption">STEEL VIPER · #11</div>
    </div>
    <div class="menu-brand">
      <div class="brand-big">RWA</div>
      <div class="brand-sub">RING WARRIORS ALLIANCE</div>
      <div class="brand-tagline">FIGHT ★ COLLECT ★ CONQUER</div>
    </div>
    <div class="menu-buttons">
      <button class="btn" onclick="showScreen('mode')">⚔ PLAY GAME</button>
      <button class="btn ghost" onclick="showScreen('collection')">🎴 MY COLLECTION</button>
      <button class="btn ghost" onclick="showScreen('shop')">🛒 SHOP</button>
      <button class="btn ghost" onclick="showScreen('rules')">📖 GAME RULES</button>
      <button class="btn ghost" onclick="showScreen('settings')">⚙ SETTINGS</button>
    </div>
    <div class="footer-note">52 WARRIORS · ONE ARENA · ENDLESS BATTLES</div>
  </div>

  <!-- MODE SELECT -->
  <div class="screen" id="screen-mode">
    <div class="subheader"><button class="back-btn" onclick="showScreen('menu')">←</button><div class="subheader-title">SELECT GAME MODE</div></div>
    <div class="mode-list">
      <div class="mode-row" onclick="selectModeAndPlay('ai')">
        <div class="mode-row-icon">🥊</div>
        <div class="mode-row-text"><div class="mode-row-title">1 PLAYER</div><div class="mode-row-sub">Play against AI</div></div>
        <div class="mode-row-arrow">›</div>
      </div>
      <div class="mode-row" onclick="selectModeAndPlay('pvp')">
